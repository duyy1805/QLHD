<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh mục vật tư - Nhà cung cấp</title>
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #115e59;
            --surface: #ffffff;
            --background: #f1f5f9;
            --border: #dbe3ec;
            --text: #172033;
            --muted: #64748b;
            --danger: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
            color: var(--text);
            background: var(--background);
            font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .page {
            width: min(1600px, calc(100% - 32px));
            margin: 28px auto;
        }

        .header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 4px;
            font-size: clamp(22px, 3vw, 32px);
            letter-spacing: -.03em;
        }

        .subtitle,
        .status {
            color: var(--muted);
        }

        .panel {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface);
            box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
        }

        .filters {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) minmax(180px, .6fr) auto auto;
            align-items: end;
            gap: 12px;
        }

        label {
            display: grid;
            gap: 6px;
            color: #334155;
            font-weight: 600;
        }

        input,
        button {
            min-height: 42px;
            border-radius: 9px;
            font: inherit;
        }

        input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, .14);
        }

        button {
            padding: 9px 16px;
            border: 0;
            color: #fff;
            background: var(--primary);
            cursor: pointer;
            font-weight: 700;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:disabled {
            cursor: wait;
            opacity: .6;
        }

        .export {
            background: #166534;
        }

        .export:hover {
            background: #14532d;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin: 16px 2px 10px;
        }

        .error {
            color: var(--danger);
        }

        .table-wrap {
            overflow: auto;
            max-height: calc(100vh - 260px);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            white-space: nowrap;
        }

        th,
        td {
            padding: 10px 12px;
            border-right: 1px solid #e7edf3;
            border-bottom: 1px solid #e7edf3;
            text-align: left;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 1;
            color: #fff;
            background: #164e63;
            font-size: 13px;
        }

        tr:nth-child(even) td {
            background: #f8fafc;
        }

        tr:hover td {
            background: #ecfeff;
        }

        td.number {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        td.truncate {
            overflow: hidden;
            max-width: 280px;
            text-overflow: ellipsis;
        }

        .empty {
            padding: 54px 20px;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 820px) {
            .page {
                width: min(100% - 20px, 1600px);
                margin: 14px auto;
            }

            .header {
                align-items: start;
                flex-direction: column;
            }

            .filters {
                grid-template-columns: 1fr 1fr;
            }

            .table-wrap {
                max-height: calc(100vh - 330px);
            }
        }

        @media (max-width: 520px) {
            .filters {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <header class="header">
            <div>
                <h1>Danh mục vật tư - Nhà cung cấp</h1>
                <div class="subtitle">Tool linh tinh chưa đẩy lên public được : D</div>
            </div>
        </header>

        <section class="panel">
            <form id="filter-form" class="filters">
                <label>
                    Nhà cung cấp
                    <input id="nha-cung-cap" name="nhaCungCap" maxlength="255" placeholder="Nhập tên nhà cung cấp...">
                </label>
                <label>
                    Mã vật tư
                    <input id="ma-vat-tu" name="maVatTu" maxlength="30" placeholder="Nhập mã vật tư...">
                </label>
                <button id="search-button" type="submit">Tìm kiếm</button>
                <button id="export-button" class="export" type="button">Xuất Excel</button>
            </form>

            <div class="meta">
                <strong id="count">0 bản ghi</strong>
                <span id="status" class="status" role="status"></span>
            </div>

            <div class="table-wrap">
                <table>
                    <thead id="table-head"></thead>
                    <tbody id="table-body">
                        <tr>
                            <td class="empty">Đang tải dữ liệu...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        /*
         * Đổi địa chỉ này thành domain/IP của API trước khi đưa file HTML
         * sang máy chủ khác. Không thêm dấu "/" ở cuối.
         */
        const API_BASE_URL = 'https://nodeapi.z76.vn';

        const columns = [
            'ID nhà cung cấp', 'Tên nhà cung cấp', 'ID vật tư', 'Mã vật tư',
            'Tên vật tư', 'ĐVT', 'ĐVT quy đổi', 'Giá trị quy đổi',
            'Ngày cập nhật giá', 'Mã tiền tệ', 'Đơn giá',
            'Đơn giá quy đổi', 'Nguồn dữ liệu'
        ];
        const numberColumns = new Set([
            'ID nhà cung cấp', 'ID vật tư', 'Giá trị quy đổi',
            'Đơn giá', 'Đơn giá quy đổi'
        ]);
        const truncateColumns = new Set(['Tên nhà cung cấp', 'Tên vật tư']);
        const form = document.getElementById('filter-form');
        const searchButton = document.getElementById('search-button');
        const exportButton = document.getElementById('export-button');
        const tableHead = document.getElementById('table-head');
        const tableBody = document.getElementById('table-body');
        const count = document.getElementById('count');
        const status = document.getElementById('status');
        const numberFormatter = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 4 });
        const dateFormatter = new Intl.DateTimeFormat('vi-VN');

        tableHead.innerHTML = '<tr>' + columns.map(
            (column) => `<th>${escapeHtml(column)}</th>`
        ).join('') + '</tr>';

        function escapeHtml(value) {
            const node = document.createElement('div');
            node.textContent = value == null ? '' : String(value);
            return node.innerHTML;
        }

        function escapeAttribute(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('"', '&quot;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;');
        }

        function buildParams() {
            const params = new URLSearchParams();
            const nhaCungCap = document.getElementById('nha-cung-cap').value.trim();
            const maVatTu = document.getElementById('ma-vat-tu').value.trim();
            if (nhaCungCap) params.set('nhaCungCap', nhaCungCap);
            if (maVatTu) params.set('maVatTu', maVatTu);
            return params;
        }

        function formatCell(column, value) {
            if (value === null || value === undefined || value === '') return '';
            if (column === 'Ngày cập nhật giá') {
                const date = new Date(value);
                return Number.isNaN(date.getTime()) ? String(value) : dateFormatter.format(date);
            }
            if (numberColumns.has(column) && Number.isFinite(Number(value))) {
                return numberFormatter.format(Number(value));
            }
            return String(value);
        }

        function renderRows(rows) {
            count.textContent = `${numberFormatter.format(rows.length)} bản ghi`;
            if (!rows.length) {
                tableBody.innerHTML =
                    `<tr><td class="empty" colspan="${columns.length}">Không tìm thấy dữ liệu phù hợp.</td></tr>`;
                return;
            }

            tableBody.innerHTML = rows.map((row) => '<tr>' + columns.map((column) => {
                const formattedValue = formatCell(column, row[column]);
                const classes = [];
                if (numberColumns.has(column)) classes.push('number');
                if (truncateColumns.has(column)) classes.push('truncate');

                const classAttribute = classes.length
                    ? ` class="${classes.join(' ')}"`
                    : '';
                const titleAttribute = truncateColumns.has(column) && formattedValue
                    ? ` title="${escapeAttribute(formattedValue)}"`
                    : '';

                return `<td${classAttribute}${titleAttribute}>${escapeHtml(formattedValue)}</td>`;
            }).join('') + '</tr>').join('');
        }

        async function loadData() {
            searchButton.disabled = true;
            status.className = 'status';
            status.textContent = 'Đang tải...';
            try {
                const query = buildParams().toString();
                const response = await fetch(
                    `${API_BASE_URL}/erp/danh-muc-vat-tu-nha-cung-cap${query ? `?${query}` : ''}`
                );
                const result = await response.json();
                if (!response.ok || !result.ok) {
                    throw new Error(result.message || 'Không thể tải dữ liệu.');
                }
                renderRows(result.data || []);
                status.textContent = 'Đã cập nhật';
            } catch (error) {
                renderRows([]);
                status.className = 'status error';
                status.textContent = error.message;
            } finally {
                searchButton.disabled = false;
            }
        }

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            loadData();
        });

        exportButton.addEventListener('click', () => {
            const query = buildParams().toString();
            window.location.href =
                `${API_BASE_URL}/erp/danh-muc-vat-tu-nha-cung-cap/export.xlsx${query ? `?${query}` : ''}`;
        });

        loadData();
    </script>
</body>

</html>
